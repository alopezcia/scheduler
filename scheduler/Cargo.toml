[package]
name = "scheduler"
version = "0.1.0"
edition = "2024"
description = "Ejecuta las tareas programadas del calendario llamando a la API REST de los sistemas SCADA"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
axum = "0.8.9"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
